[project]
name = "x64dbg_automate"
version = "0.9.2+local.13"
description = "A Python library to automate x64dbg (local fork, local.10 patch set)"
authors = [{ name = "Darius Houle", email = "darius@x64.ooo" }]
readme = "README.md"
keywords = ["x64dbg", "debugger", "instrumentation", "plugin", "dynamic-analysis"]
requires-python = ">=3.10,<4.0"
dependencies = [
  "pyzmq>=27.1.0,<28.0.0",
  "msgpack>=1.2.1,<2.0.0",
  "pydantic>=2.10.6,<3.0.0",
  "psutil>=6.1.1,<7.0.0",
]

[project.urls]
Homepage = "https://dariushoule.github.io/x64dbg-automate-pyclient/"
Repository = "https://github.com/dariushoule/x64dbg-automate-pyclient"
Issues = "https://github.com/dariushoule/x64dbg-automate-pyclient/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2.0.0"]

[project.scripts]
x64dbg-automate-mcp = "x64dbg_automate.mcp_server_local:main"

[tool.setuptools]
packages = ["x64dbg_automate"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
