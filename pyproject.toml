[project]
name = "x64dbg_automate"
version = "0.9.3"
description = "A Python library to automate x64dbg"
authors = [{ name = "Darius Houle", email = "darius@x64.ooo" }]
readme = "README.md"
keywords = ["x64dbg", "debugger", "instrumentation", "plugin", "dynamic-analysis"]

[project.urls]
Homepage = "https://dariushoule.github.io/x64dbg-automate-pyclient/"
Repository = "https://github.com/dariushoule/x64dbg-automate-pyclient"
Issues = "https://github.com/dariushoule/x64dbg-automate-pyclient/issues"

[tool.poetry.dependencies]
python = "^3.10"
pyzmq = "^27.1.0"
msgpack = "^1.2.3"
pydantic = "^2.10.6"
psutil = ">=6.1.1,<8"
mcp = {version = "^1.30.0", optional = true}

[tool.poetry.extras]
mcp = ["mcp"]

[tool.poetry.scripts]
x64dbg-automate-mcp = "x64dbg_automate.mcp_server:main"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mkdocstrings = {extras = ["python"], version = "^1.0.8", python = ">=3.11"}
mkdocs = "^1.6.1"
mkdocs-autorefs = {version = "^1.4.5", python = ">=3.11"}
pytest = "^9.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
